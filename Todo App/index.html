<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4z8E2ZfF5c+K0Q=="
crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <h1>To-Do List App</h1>
            <form class="input-area">
                <input type="text" id="task-input" placeholder="Add a new task..." required>
                <button type="submit" id="add-task-btn"><i class="fa-solid fa-plus"></i></button>
            </form>
            <div class="todos-container">
                <ul id="task-list"> 
            
                </ul>
               
                <img src="./images/empty.png" alt="empty" class="empty-image">
            </div>
        </div>
    </div>

<script src="script1.js"></script>

</body>
</html>
